# e2e-d1-varlen-prefill-attn-sol — Type-3 E2E optimisation task.

schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "varlen-prefill-attn-sol"
bench = "e2e"
kind = "performance"
language = "python"
title = "Variable-length causal prefill attention — get as close to the hardware as you can"
ext_id = "e2e-d1-varlen-prefill-attn-sol"
instruction = "instruction.md"

[agent]
timeout_sec = 5400

# OPEN-SOURCE: build the image from this task package (no private registry):
#   cd <this-dir>/task && docker build -f environment/Dockerfile -t fai/e2e-d1-varlen:oss .
# (Original private prebuilt image, for provenance only — NOT required to run:
#   <internal registry>/kernelbench/e2e-d1-varlen-prefill-attn-sol@sha256:35b4b760c9bf7185c233736279870b1e4e1ca86c752f4c3f23c220698e11cfd7 )
# 🔁 LOOP16: the shipped image is the loop16 overlay (`crane append` onto the :oss base, purely
#    additive — /opt/loop + /app/instruction.md only, NOTHING under tests/ changed). Build in two steps:
#      docker build -f environment/Dockerfile             -t fai/e2e-d1-varlen:oss .
#      docker build -f environment/loop_overlay/Dockerfile -t fai/e2e-d1-varlen:oss-loop16 environment/loop_overlay
#    The single-shot form (:oss) is a valid alternative; the graded surface (tests/) is identical in both.
[environment]
docker_image = "fai/e2e-d1-varlen:oss-loop16"
dockerfile = "environment/loop_overlay/Dockerfile"
dockerfile_single_shot = "environment/Dockerfile"
build_timeout_sec = 1200   # prebuilt image (v4: /opt/verifier removed, corrected reward prose), just pull
cpus = 8
memory_mb = 65536
gpus = 1
# 开源版: H20 是 ref_speedup 的标定卡,不是硬性限制。换卡可跑,但须按
# tests/verifier-correctness-manifest.json 的 recalibrate_howto 重标锚点;
# 并用 --build-arg TORCH_CUDA_ARCH_LIST=<你的算力> 构建镜像。
gpu_types = ["H20"]
storage_mb = 40000
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
task_kind = "e2e_optimization"
submission_root = "/app/repo/submission"
submission_entry = "/app/repo/submission/varlen_prefill_attn.py"
forbidden_edit_paths = [
    "/tests",
    "/opt/verifier",
    "/opt/verifier/harness/bench_prefill.py",
    "/opt/verifier/harness/baseline_prefill.py",
    "/opt/verifier/harness/hidden_suite.json",
    "/opt/verifier/compute_reward.py",
    "/opt/verifier/verifier-correctness-manifest.json",
    "/app/timer.sh",
    "/app/.timer",
]
result_paths = ["/logs/verifier"]

[verifier.frozen]
note = "v1 声明不出 primary_edit_paths:整个 repo 可编辑,被计分的交付物是 [verifier].submission_entry;评分面靠 [verifier].forbidden_edit_paths + tests/test.sh 里的 sha256 门冻结。"

[primary_metric]
name = "log_speedup_vs_ref_speedup"
goal = "maximize"
# 此结果(ref_speedup=1.5317)在 H20 上测得;若硬件不一致,建议使用 oracle 实现
# solution/ceiling_triton_prefill.py 重新标定该锚点。
reward_formula = "reward = min(1.0, ln(speedup/ref_speedup)/ln(ref_speedup)) if speedup > ref_speedup else 0.0 in [0,1]; speedup == strong baseline => 0; speedup == ref_speedup (1.5317) => 0 (打平 oracle 不得分,必须超过); speedup == ref_speedup^1.5 => 0.5; speedup >= ref_speedup^2 => 1.0"
ref_speedup = 1.5317
ref_speedup_source = "tests/verifier-correctness-manifest.json"
calibrated_on = "NVIDIA H20"

# loop16: the shipped image bakes /opt/loop; the in-session dev proxy runs the candidate attention
# kernel on the author's PUBLIC dev suite (fp32 causal-parity gated) for a RAW achieved-TFLOP/s
# best-of-k ranking signal (NO strong baseline, NO hidden suite, NO calibrated anchor baked). At most
# 16 submissions, at least 1; the model decides when to stop (min=1 so --finalize works any time).
# The graded score is the runner's fresh end-of-session tests/ grade (strong-baseline ABBA over
# hidden workloads + calibrated anchor).
[loop]
min_submissions = 1
max_submissions = 16
submit = "bash /opt/loop/submit.sh"

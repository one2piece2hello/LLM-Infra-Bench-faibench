schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "wro-lora-punica-fused"
bench = "lh"
kind = "performance"
language = "python"
title = "A multi-LoRA batched apply subsystem (the shrink → expand path) in this repository is functionally correct but slow."
instruction = "instruction.md"

[agent]
timeout_sec = 5400

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/wro-lora-punica-fused-loop16:v1-ms1@sha256:da1e464dad443a5fecf7d125a78f67546d1eb03d82c3b361d5aa8ced5cbd02c8
# Open-source build: `cd <this dir> && docker build -f environment/Dockerfile -t fai/lh-lora-punica-fused:oss .`
[environment]
docker_image = "fai/lh-lora-punica-fused:oss"
dockerfile = "environment/Dockerfile"
build_timeout_sec = 3600
cpus = 8
memory_mb = 32768
gpus = 1
# H20 只是**锚点标定用卡**,不是硬性限制。换卡时:
#   1) 按 tests/verifier-correctness-manifest.json 的 recalibrate_howto 重新标定锚点;
#   2) 用 --build-arg TORCH_CUDA_ARCH_LIST=<你的算力> 构建镜像(8.0 A100 / 8.9 L40S·4090 / 9.0 H100·H20 / 10.0 B200)。
gpu_types = ["H20"]
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
task_kind = "acceleration"
contract_pattern = "kernelbench_generic_v1"
primary_edit_paths = [
    "vllm/lora/ops/triton_ops/kernel_utils.py",
    "vllm/lora/ops/triton_ops/lora_shrink_op.py",
    "vllm/lora/ops/triton_ops/lora_expand_op.py",
]
forbidden_edit_paths = ["*"]
result_paths = ["/logs/verifier/reward.json"]

[primary_metric]
name = "speedup"
goal = "maximize"
ref_speedup = 16.59
ref_speedup_source = "tests/verifier-correctness-manifest.json"
calibrated_on = "NVIDIA H20"

[loop]
min_submissions = 1
max_submissions = 16
submit = "bash /opt/loop/submit.sh"

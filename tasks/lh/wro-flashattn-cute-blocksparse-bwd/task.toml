schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "wro-flashattn-cute-blocksparse-bwd"
bench = "lh"
kind = "performance"
language = "python"
title = "A subsystem in this repository computes a differentiable block-sparse multi-head attention operation: given query, key …"
instruction = "instruction.md"

[agent]
timeout_sec = 5400

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/wro-flashattn-cute-blocksparse-bwd-loop16:v1-ms1-dl1@sha256:c0c713899ea2870be6eea3cb6dc3666f55f7d75ac1ad88a4cf33ad70fb706d5b
# Open-source build: `cd <this dir> && docker build -f environment/Dockerfile -t fai/lh-flashattn-cute-blocksparse-bwd:oss .`
[environment]
docker_image = "fai/lh-flashattn-cute-blocksparse-bwd:oss"
dockerfile = "environment/Dockerfile"
build_timeout_sec = 3600
cpus = 8
memory_mb = 32768
gpus = 1
# H20 只是**锚点标定用卡**,不是硬性限制。换卡时:
#   1) 按 tests/verifier-correctness-manifest.json 的 recalibrate_howto 重新标定锚点;
#   2) 用 --build-arg TORCH_CUDA_ARCH_LIST=<你的算力> 构建镜像(8.0 A100 / 8.9 L40S·4090 / 9.0 H100·H20 / 10.0 B200)。
gpu_types = ["H20"]
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
task_kind = "acceleration"
contract_pattern = "kernelbench_generic_v1"
primary_edit_paths = ["flash_attn/cute/interface.py"]
forbidden_edit_paths = ["*"]
result_paths = ["/logs/verifier/reward.json"]

[primary_metric]
name = "speedup"
goal = "maximize"
ref_speedup = 49.008492
ref_speedup_source = "environment/verifier-correctness-manifest.json"
calibrated_on = "NVIDIA H20"

[loop]
min_submissions = 1
max_submissions = 16
submit = "bash /opt/loop/submit.sh"

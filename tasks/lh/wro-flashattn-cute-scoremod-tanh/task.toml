schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "wro-flashattn-cute-scoremod-tanh"
bench = "lh"
kind = "performance"
language = "python"
title = "A subsystem in this repository computes a multi-head attention forward pass with a user-provided score modification: given query, key …"
instruction = "instruction.md"

[agent]
timeout_sec = 5400

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/wro-flashattn-cute-scoremod-tanh-loop16:v2@sha256:5b9ee3310f1616468f60a7762facfc618e32a3f4e2840ce70015cc5e0c354dc9
# Open-source build: `cd <this dir> && docker build -f environment/Dockerfile -t fai/lh-flashattn-cute-scoremod-tanh:oss .`
[environment]
docker_image = "fai/lh-flashattn-cute-scoremod-tanh:oss"
dockerfile = "environment/Dockerfile"
build_timeout_sec = 3600
cpus = 8
memory_mb = 32768
gpus = 1
# H20 只是**锚点标定用卡**,不是硬性限制。换卡时:
#   1) 按 tests/verifier-correctness-manifest.json 的 recalibrate_howto 重新标定锚点;
#   2) 用 --build-arg TORCH_CUDA_ARCH_LIST=<你的算力> 构建镜像(8.0 A100 / 8.9 L40S·4090 / 9.0 H100·H20 / 10.0 B200)。
gpu_types = ["H20"]
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
task_kind = "acceleration"
contract_pattern = "kernelbench_generic_v1"
primary_edit_paths = ["flash_attn/cute/interface.py"]
forbidden_edit_paths = ["*"]
result_paths = ["/logs/verifier/reward.json"]

[primary_metric]
name = "speedup"
goal = "maximize"
ref_speedup = 31.37
ref_speedup_source = "environment/verifier-correctness-manifest.json"
calibrated_on = "NVIDIA H20"

[loop]
min_submissions = 1
max_submissions = 16
submit = "bash /opt/loop/submit.sh"

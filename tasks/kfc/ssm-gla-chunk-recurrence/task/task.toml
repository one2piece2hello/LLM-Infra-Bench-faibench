schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "ssm-gla-chunk-recurrence"
bench = "kfc"
kind = "performance"
language = "python"
title = "You are working on a sequence-mixing layer inside a long-context language model."
instruction = "instruction.md"

[agent]
timeout_sec = 21600

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/insea-ssm-gla-chunk-recurrence-loop16:loop-20260720T071534Z@sha256:702f9c947ca96b0d8a998cb1a5a46c3f47c8c22346bf097a1757f53b417fe900
# Open-source build: `cd <this dir> && docker build -f environment/Dockerfile -t fai/kfc-ssm-gla-chunk-recurrence:oss .`
[environment]
docker_image = "fai/kfc-ssm-gla-chunk-recurrence:oss"
dockerfile = "environment/Dockerfile"
build_timeout_sec = 3600
cpus = 8
memory_mb = 32000
gpus = 1
# H20 只是**锚点标定用卡**,不是硬性限制。换卡时:①按 tests/ref_speedup.caveat.md 重标锚点;
#   ②用 --build-arg TORCH_CUDA_ARCH_LIST=<你的算力> 构建镜像。
gpu_types = ["H20"]
gpu_memory_gb = 96
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
timeout_sec = 3600
task_kind = "acceleration"
contract_pattern = "A"
timing_metric = "wall_time_ms"
candidate_source_root = "/app/repo"
primary_edit_paths = ["/app/repo/gated_state_recurrence.py"]
forbidden_edit_paths = ["/app/repo/tests/**", "/opt/verifier-*", "/tests/**", "/opt/loop/**"]
result_paths = [
    "/logs/verifier/verifier_state.json",
    "/logs/verifier/correctness_results.json",
    "/logs/verifier/benchmark_results.json",
    "/logs/verifier/reward.json",
    "/logs/verifier/reward.txt",
]

[primary_metric]
name = "gated_state_recurrence_gpu_speedup"
goal = "maximize"
metric_kind = "wall_time"
reward_formula = "acceleration: reward = min(1.0, ln(speedup/ref_speedup)/ln(ref_speedup)) if speedup > ref_speedup else 0.0 — 0.5 at parity with the oracle, capped 1.0 at oracle^2; speedup = measured speedup (per-shape baseline_ms/candidate_ms, geomean over 4 long-sequence (B,H,L,D) workload shapes) on H20; the naive baseline is an O(L) sequential gated recurrence so wall-time tracks the latency value axis. The 12-case hidden correctness suite (output + final-state parity, decay-gate degenerate axes, causality and state-threading metamorphics), anti-cheat (only gated_state_recurrence.py may change) and the third-party-sequence-mixing-library ban are hard gates."
ref_speedup = 62.2504
ref_speedup_source = "tests/ref_speedup.txt"
calibrated_on = "NVIDIA H20"
correctness_gates = [
    "hidden_parity_suite",
    "normal_bf16",
    "normal_fp16_rectangular",
    "normal_long_L",
    "boundary_L1",
    "boundary_initial_state",
    "degenerate_no_decay",
    "degenerate_strong_decay",
    "degenerate_v_zero",
    "error_contract",
    "metamorphic_prefix_causality",
    "metamorphic_state_threading",
    "hidden_mixed_decay",
    "anti_cheat_forbidden_edit",
    "forbidden_linear_attn_library",
]

[loop]
min_submissions = 1
max_submissions = 1
submit = "bash /opt/loop/submit.sh"
mode = "baked"
feedback_surface = "/opt/loop/submit.sh"

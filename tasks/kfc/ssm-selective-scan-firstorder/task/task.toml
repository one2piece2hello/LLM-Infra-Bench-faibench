schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "ssm-selective-scan-firstorder"
bench = "kfc"
kind = "performance"
language = "python"
title = "You are working on the core sequence operator inside a state-space / linear-recurrence block of a sequence model."
instruction = "instruction.md"

[agent]
timeout_sec = 21600

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/insea-ssm-selective-scan-firstorder-loop16:loop-20260720T060134Z@sha256:750db144e41799d238eaf9e386551c36f79de7dccfca030e67eb3389f2ea15e4
# Open-source build: `cd <this dir> && docker build -f environment/Dockerfile -t fai/kfc-ssm-selective-scan-firstorder:oss .`
[environment]
docker_image = "fai/kfc-ssm-selective-scan-firstorder:oss"
dockerfile = "environment/Dockerfile"
build_timeout_sec = 3600
cpus = 8
memory_mb = 32000
gpus = 1
# H20 只是**锚点标定用卡**,不是硬性限制。换卡时:①按 tests/ref_speedup.caveat.md 重标锚点;
#   ②用 --build-arg TORCH_CUDA_ARCH_LIST=<你的算力> 构建镜像。
gpu_types = ["H20"]
gpu_memory_gb = 96
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
timeout_sec = 3600
task_kind = "acceleration"
contract_pattern = "A"
timing_metric = "wall_time_ms"
candidate_source_root = "/app/repo"
primary_edit_paths = ["/app/repo/state_space_scan.py"]
forbidden_edit_paths = ["/app/repo/tests/**", "/opt/verifier-*", "/tests/**", "/opt/loop/**"]
result_paths = [
    "/logs/verifier/verifier_state.json",
    "/logs/verifier/correctness_results.json",
    "/logs/verifier/benchmark_results.json",
    "/logs/verifier/reward.json",
    "/logs/verifier/reward.txt",
]

[primary_metric]
name = "state_space_scan_gpu_speedup"
goal = "maximize"
metric_kind = "wall_time"
reward_formula = "acceleration: reward = min(1.0, ln(speedup/ref_speedup)/ln(ref_speedup)) if speedup > ref_speedup else 0.0; the underlying measurement is measured speedup (per-shape baseline_ms/candidate_ms, geomean over 4 long-time-axis (B,L,D,N) workload shapes) on H20; the value axis is latency via parallel depth (sequential O(L) time loop vs O(log L)-depth parallel scan). The 12-case hidden correctness suite (float32 primary + a bf16 long-L regime, state-order-preserving causality/prefix-consistency metamorphics), anti-cheat (only state_space_scan.py may change) and the library-scan-primitive ban are hard gates."
ref_speedup = 103.1823
ref_speedup_source = "tests/ref_speedup.txt"
calibrated_on = "NVIDIA H20"
correctness_gates = [
    "hidden_parity_suite",
    "normal_f32",
    "normal_shape_variant",
    "boundary_L1",
    "boundary_nonpow2_L",
    "degenerate_A_zero",
    "degenerate_A_one",
    "error_dtype",
    "error_shape",
    "metamorphic_causality",
    "metamorphic_prefix_consistency",
    "error_amplify_no_clamp",
    "hidden_bf16_large_L",
    "anti_cheat_forbidden_edit",
    "forbidden_library_scan_primitive",
]

[loop]
min_submissions = 1
max_submissions = 1
submit = "bash /opt/loop/submit.sh"
mode = "baked"
feedback_surface = "/opt/loop/submit.sh"

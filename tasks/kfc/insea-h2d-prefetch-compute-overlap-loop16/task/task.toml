schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "insea-h2d-prefetch-compute-overlap-loop16"
bench = "kfc"
kind = "performance"
language = "python"
title = "You are working on the data-movement front-end of a chunked GPU workload in a high-throughput inference server."
instruction = "instruction.md"

[agent]
timeout_sec = 21600

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/insea-h2d-prefetch-compute-overlap-loop16:loop-20260720T122325Z@sha256:3e3668421a5b1587309227488ca4553f1c054757ee36f45545759e31edfa0940
# Open-source build: `cd <this dir> && docker build -f environment/Dockerfile -t fai/kfc-insea-h2d-prefetch-compute-overlap-loop16:oss .`
[environment]
docker_image = "fai/kfc-insea-h2d-prefetch-compute-overlap-loop16:oss"
dockerfile = "environment/Dockerfile"
build_timeout_sec = 3600
cpus = 8
memory_mb = 32000
gpus = 1
# H20 只是**锚点标定用卡**,不是硬性限制。换卡时:①按 tests/ref_speedup.caveat.md 重标锚点;
#   ②用 --build-arg TORCH_CUDA_ARCH_LIST=<你的算力> 构建镜像。
gpu_types = ["H20"]
gpu_memory_gb = 96
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
timeout_sec = 3600
task_kind = "acceleration"
contract_pattern = "A"
timing_metric = "wall_time_ms"
candidate_source_root = "/app/repo"
primary_edit_paths = ["/app/repo/streamed_apply.py"]
forbidden_edit_paths = ["/app/repo/tests/**", "/opt/verifier-*", "/tests/**", "/opt/loop/**"]
result_paths = [
    "/logs/verifier/verifier_state.json",
    "/logs/verifier/correctness_results.json",
    "/logs/verifier/benchmark_results.json",
    "/logs/verifier/reward.json",
    "/logs/verifier/reward.txt",
]

[primary_metric]
name = "h2d_prefetch_overlap_gpu_speedup"
goal = "maximize"
metric_kind = "wall_time"
reward_formula = "acceleration: reward = min(1.0, ln(speedup/ref_speedup)/ln(ref_speedup)) if speedup > ref_speedup else 0.0 — 0.5 at parity with the oracle, capped 1.0 at oracle^2; speedup = measured speedup (per-config baseline_ms/candidate_ms, geomean over 4 copy/compute-balanced chunk-streaming configs) on H20; the win comes from overlapping each chunk's host-to-device copy with the previous chunk's compute so total latency -> max(copy,compute) instead of the serial sum. The 12-case hidden correctness suite (result identical to the sequential copy-then-compute reference, in chunk order), anti-cheat (only streamed_apply.py may change) and the framework auto-overlap/graph-capture ban are hard gates."
ref_speedup = 1.4856
ref_speedup_source = "tests/ref_speedup.txt"
calibrated_on = "NVIDIA H20"
correctness_gates = [
    "hidden_parity_suite",
    "normal_multi",
    "fp16_and_bf16",
    "varying_rows",
    "single_chunk",
    "many_small",
    "zero_row_chunk",
    "degenerate_empty",
    "error_reject",
    "metamorphic_chunk_order",
    "determinism_repeat",
    "hidden_large_work_evidence",
    "trusted_restore",
    "anti_cheat_forbidden_edit",
    "forbidden_overlap_helper",
]

[loop]
min_submissions = 1
max_submissions = 1
submit = "bash /opt/loop/submit.sh"
mode = "baked"
feedback_surface = "/opt/loop/submit.sh"

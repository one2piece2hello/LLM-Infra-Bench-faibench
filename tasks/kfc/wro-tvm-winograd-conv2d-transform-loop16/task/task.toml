schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "wro-tvm-winograd-conv2d-transform-loop16"
bench = "kfc"
kind = "performance"
language = "python"
title = "A 3x3 convolution on a phone or an edge box is the single most expensive node in most vision graphs …"
instruction = "instruction.md"

[agent]
timeout_sec = 5400

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/wro-tvm-winograd-conv2d-transform-loop16:v1@sha256:9f700cb13c445f16e55da2c9b06643cdf664fb4f905ae52aed3bf54ea9a37f26
# Open-source build: `cd <this dir> && docker build -f environment/Dockerfile -t fai/kfc-wro-tvm-winograd-conv2d-transform-loop16:oss .`
[environment]
docker_image = "fai/kfc-wro-tvm-winograd-conv2d-transform-loop16:oss"
dockerfile = "environment/Dockerfile"
build_timeout_sec = 3600
cpus = 8
memory_mb = 32768
gpus = 0
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
primary_edit_paths = ["winograd_conv.py"]
result_paths = ["/logs/verifier/reward.json"]

[primary_metric]
name = "reward"
goal = "maximize"
ref_speedup = 891.920536
ref_speedup_source = "tests/ref_speedup.txt"
calibrated_on = "Intel Sapphire Rapids CPU lane"

[loop]
# NOTE: the /opt/loop harness baked into the image applies its own 3/16 in-session budget; for in-session loop scoring the image is authoritative.
min_submissions = 1
max_submissions = 1
submit = "bash /opt/loop/submit.sh"

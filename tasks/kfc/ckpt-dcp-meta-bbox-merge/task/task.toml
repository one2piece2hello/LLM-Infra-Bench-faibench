# ckpt-dcp-meta-bbox-merge. CPU task.
# 训练容错与checkpoint: distributed-checkpoint metadata merge across ranks — per-tensor global
# extent (max end offset) from interleaved shard records. PERFORMANCE (speedup).

schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "ckpt-dcp-meta-bbox-merge"
bench = "kfc"
kind = "performance"
language = "python"
title = "distributed-checkpoint metadata merge across ranks — per-tensor global"
instruction = "instruction.md"

[agent]
timeout_sec = 5400

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/wre-ckpt-dcp-meta-bbox-merge:v1@sha256:4f897b743d24cc72f6235b5215f9230abe7f243c18f19606797c8b84177b7621
# 🔁 LOOP16: the shipped image is the loop16 overlay (`crane append` onto the :oss base, purely
#    additive — /opt/loop only, NOTHING under tests/ changed), so the "1..16 submissions" the
#    instruction promises is REAL. Build it in two steps:
#      docker build -f environment/Dockerfile             -t fai/kfc-ckpt-dcp-meta-bbox-merge:oss .
#      docker build -f environment/loop_overlay/Dockerfile -t fai/kfc-ckpt-dcp-meta-bbox-merge:oss-loop16 environment/loop_overlay
#    The single-shot form (:oss) is a valid alternative; the graded surface (tests/) is identical in both.
[environment]
docker_image = "fai/kfc-ckpt-dcp-meta-bbox-merge:oss"
build_timeout_sec = 3600
cpus = 4
memory_mb = 16384
gpus = 0
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
task_kind = "performance"
contract_pattern = "kernelbench_generic_v1"
timing_metric = "speedup"
primary_edit_paths = ["submission/kernel.py"]
forbidden_edit_paths = ["*"]
result_paths = ["/logs/verifier/reward.json"]

[primary_metric]
name = "speedup"
goal = "maximize"
reward_formula = "performance: reward = min(1.0, ln(speedup/ref_speedup)/ln(ref_speedup)) if speedup > ref_speedup else 0.0 — 0.5 at parity with the oracle, capped 1.0 at oracle^2; 0 if a hard gate fails or speedup <= 1. ref_speedup source unchanged (tests/ref_speedup.txt or the in-image manifest)."
ref_speedup = 41666.666667
ref_speedup_source = "tests/ref_speedup.txt"
calibrated_on = "Intel Sapphire Rapids CPU lane"

# loop16: the shipped image bakes /opt/loop; the in-session dev proxy re-runs THIS task's own
# verifier (candidate mode) on the live /app/repo for a RAW best-of-k ranking signal (NO calibrated
# anchor baked). At most 16 submissions, at least 1; the model decides when to stop (min=1 so
# --finalize works any time). The graded score is the runner's fresh end-of-session tests/ grade.

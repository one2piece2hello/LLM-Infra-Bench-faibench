schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "flash-online-softmax-prefill"
bench = "kfc"
kind = "performance"
language = "python"
title = "You are working on the attention step inside the transformer stack of a high-throughput LLM inference server."
instruction = "instruction.md"

[agent]
timeout_sec = 21600

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/insea-flash-online-softmax-prefill-loop16:loop-20260720T041357Z@sha256:04a53f53d9849bb2801d11fdfcf1099e2746efd43c1bd310b882ba37670cc514
# Open-source build: `cd <this dir> && docker build -f environment/Dockerfile -t fai/kfc-flash-online-softmax-prefill:oss .`
[environment]
docker_image = "fai/kfc-flash-online-softmax-prefill:oss"
dockerfile = "environment/Dockerfile"
build_timeout_sec = 3600
cpus = 8
memory_mb = 32000
gpus = 1
# H20 只是**锚点标定用卡**,不是硬性限制。换卡时:①按 tests/ref_speedup.caveat.md 重标锚点;
#   ②用 --build-arg TORCH_CUDA_ARCH_LIST=<你的算力> 构建镜像。
gpu_types = ["H20"]
gpu_memory_gb = 96
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
timeout_sec = 3600
task_kind = "acceleration"
contract_pattern = "A"
timing_metric = "peak_memory_bytes"
candidate_source_root = "/app/repo"
primary_edit_paths = ["/app/repo/causal_attention.py"]
forbidden_edit_paths = ["/app/repo/tests/**", "/opt/verifier-*", "/tests/**", "/opt/loop/**"]
result_paths = [
    "/logs/verifier/verifier_state.json",
    "/logs/verifier/correctness_results.json",
    "/logs/verifier/benchmark_results.json",
    "/logs/verifier/reward.json",
    "/logs/verifier/reward.txt",
]

[primary_metric]
name = "causal_attention_gpu_peakmem_speedup"
goal = "maximize"
metric_kind = "peak_memory"
reward_formula = "reward = min(1.0, ln(speedup/ref_speedup)/ln(ref_speedup)) if speedup > ref_speedup else 0.0 per the reward specification (speedup == ref_speedup -> 0.0 (must EXCEED it to score); speedup>=ref_speedup^2 -> 1.0 cap; range [0,1]); reward = 0 on any hard gate, on speedup<=1, or on ref_speedup<=1. acceleration: measured peak-memory speedup (per-shape baseline_peak_bytes/candidate_peak_bytes via torch.cuda.max_memory_allocated, geomean over 4 workload shapes) on H20; the naive baseline materializes the (S,S) score+probability matrices (peak ~ O(B*H*S*S)) while a working-set candidate stays ~ O(B*H*S*D). The 12-case hidden correctness suite, anti-cheat (only causal_attention.py may change) and the fused-attention-primitive ban are hard gates."
ref_speedup = 6.0
ref_speedup_source = "tests/ref_speedup.txt"
calibrated_on = "NVIDIA H20"
correctness_gates = [
    "hidden_parity_suite",
    "normal_causal",
    "normal_noncausal",
    "normal_gqa",
    "fp16_and_bf16",
    "boundary_S_nontile_D64",
    "single_position",
    "error_reject",
    "metamorphic_scale_v",
    "metamorphic_key_shift",
    "trusted_restore",
    "anti_cheat_forbidden_edit",
    "forbidden_fused_attention_primitive",
]

[loop]
min_submissions = 1
max_submissions = 1
submit = "bash /opt/loop/submit.sh"
mode = "baked"
feedback_surface = "/opt/loop/submit.sh"
declared_submission_policy = "single_submission"

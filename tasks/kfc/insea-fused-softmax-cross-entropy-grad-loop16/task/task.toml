schema_version = "2.0"

# 提交产物(pre_artifacts.sh 在判分前于同一容器内产出;规范 §1)
artifacts = ["/logs/artifacts/model.patch", "/logs/artifacts/model_files.txt"]

[task]
id = "insea-fused-softmax-cross-entropy-grad-loop16"
bench = "kfc"
kind = "performance"
language = "python"
title = "You are working on the loss stage of a large language model's training step."
instruction = "instruction.md"

[agent]
timeout_sec = 21600

# carved-tree provenance (environment/repo/ recovered from): <internal registry>/kernelbench/insea-fused-softmax-cross-entropy-grad-loop16:loop-20260720T021136Z@sha256:dbd2b4dbf93aa3621d94de371a783ff2d77d7978cc4b93a6c19819d36a68a7f9
# Open-source build: `cd <this dir> && docker build -f environment/Dockerfile -t fai/kfc-insea-fused-softmax-cross-entropy-grad-loop16:oss .`
[environment]
docker_image = "fai/kfc-insea-fused-softmax-cross-entropy-grad-loop16:oss"
dockerfile = "environment/Dockerfile"
build_timeout_sec = 3600
cpus = 8
memory_mb = 32000
gpus = 1
# H20 只是**锚点标定用卡**,不是硬性限制。换卡时:①按 tests/ref_speedup.caveat.md 重标锚点;
#   ②用 --build-arg TORCH_CUDA_ARCH_LIST=<你的算力> 构建镜像。
gpu_types = ["H20"]
gpu_memory_gb = 96
allow_internet = false

[verifier]
entrypoint = "tests/test.sh"
mode = "shared"
timeout_sec = 3600
task_kind = "acceleration"
contract_pattern = "A"
timing_metric = "peak_memory_bytes"
candidate_source_root = "/app/repo"
primary_edit_paths = ["/app/repo/cross_entropy_grad.py"]
forbidden_edit_paths = ["/app/repo/tests/**", "/opt/verifier-*", "/tests/**", "/opt/loop/**"]
result_paths = [
    "/logs/verifier/verifier_state.json",
    "/logs/verifier/correctness_results.json",
    "/logs/verifier/benchmark_results.json",
    "/logs/verifier/reward.json",
    "/logs/verifier/reward.txt",
]

[primary_metric]
name = "cross_entropy_grad_peak_memory_ratio"
goal = "maximize"
metric_kind = "peak_memory"
reward_formula = "reward = min(1.0, ln(speedup/ref_speedup)/ln(ref_speedup)) if speedup > ref_speedup else 0.0 per the reward specification (speedup == ref_speedup -> 0.0 (must EXCEED it to score); speedup>=ref_speedup^2 -> 1.0 cap; range [0,1]); reward = 0 on any hard gate, on speedup<=1, or on ref_speedup<=1. acceleration: measured PEAK-MEMORY speedup = torch.cuda.max_memory_allocated(baseline)/max_memory_allocated(candidate), geomean over 4 large-vocab shapes on H20 (NOT wall-time; latency may be ~1.0x). The 12-case hidden correctness suite, anti-cheat (only cross_entropy_grad.py may change) and the fused-cross-entropy-primitive ban are hard gates; reward is 0 on any correctness/anti-cheat failure."
ref_speedup = 7.4157
ref_speedup_source = "tests/ref_speedup.txt"
calibrated_on = "NVIDIA H20"
correctness_gates = [
    "hidden_parity_suite",
    "all_ignore_rows",
    "single_class",
    "single_row",
    "nontile_vocab",
    "label_smoothing",
    "degenerate",
    "error_reject",
    "metamorphic",
    "work_evidence_nonzero_rows",
    "trusted_restore",
    "anti_cheat_forbidden_edit",
    "forbidden_fused_ce_primitive",
]

[loop]
min_submissions = 1
max_submissions = 1
submit = "bash /opt/loop/submit.sh"
mode = "baked"
feedback_surface = "/opt/loop/submit.sh"
declared_submission_policy = "single_submission"
